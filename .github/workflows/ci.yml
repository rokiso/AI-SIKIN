name: Development checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run db:generate && npm run db:validate && npm run db:migrate
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm run test && npm run test:db
      - name: Prepare reviewed procedure catalog in the isolated local database
        run: |
          npm run procedures:seed
          for price_file in data/procedure-prices/2026-11-24/P-*.json; do
            npm run procedures:prices -- "$price_file" --apply
          done
      - run: npx playwright install --with-deps chromium
      - name: Select installed Chromium
        run: node --input-type=module -e 'import { chromium } from "@playwright/test"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${chromium.executablePath()}\n`);'
      - run: npm run build && npm run test:e2e
      - name: Verify isolated core journey and strict performance gates
        run: npm run test:core
      - name: Save core journey metrics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-journey-evidence
          path: |
            test-results/**/attachments/*.json
            test-results/**/core-*.png
          if-no-files-found: ignore
      - if: always()
        run: npm run db:stop
